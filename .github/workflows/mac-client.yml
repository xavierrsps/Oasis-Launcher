name: Build macOS client (.dmg)

# Packages the Oasis client (Oasis.jar) into a double-click macOS .dmg with a BUNDLED Java
# runtime via jpackage, so a player just downloads, opens, drags to Applications and plays —
# no Terminal, no "install Java". Built on GitHub's macOS runners (jpackage can only build for
# the host OS). Produces both Apple-Silicon (arm64) and Intel (x64) images.

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version (digits only, e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

env:
  TAG: mac-client-latest

jobs:
  # Single writer: ensure the rolling release exists BEFORE the matrix uploads to it (no race).
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "Oasis — macOS client" \
              --notes "Double-click .dmg with a bundled Java runtime. Apple Silicon = arm64, Intel = x64. First launch on an unsigned build: right-click the app then Open (once)."
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            arch: arm64
          - runner: macos-13   # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up Temurin JDK 21 (${{ matrix.arch }})
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download the current client jar (from client-manifest.json)
        run: |
          set -euxo pipefail
          mkdir -p input out
          URL=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/client-manifest.json" | python3 -c "import sys,json;print(json.load(sys.stdin)['url'])")
          echo "Client jar: $URL"
          curl -fsSL "$URL" -o input/Oasis.jar
          ls -la input

      - name: Package .dmg with jpackage (bundled runtime)
        run: |
          set -euxo pipefail
          VER="${{ github.event.inputs.app_version || '1.0.0' }}"
          jpackage \
            --type dmg \
            --name Oasis \
            --app-version "$VER" \
            --input input \
            --main-jar Oasis.jar \
            --main-class net.runelite.client.RuneLite \
            --runtime-image "$JAVA_HOME" \
            --mac-package-identifier com.oasis.client \
            --java-options "-Xmx768m" \
            --java-options "-Dsun.java2d.metal=true" \
            --vendor "Oasis" \
            --dest out
          ls -la out
          mv "out/Oasis-$VER.dmg" "out/Oasis-macOS-${{ matrix.arch }}.dmg"
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oasis-macOS-${{ matrix.arch }}
          path: out/Oasis-macOS-${{ matrix.arch }}.dmg

      - name: Publish .dmg to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release upload "$TAG" "out/Oasis-macOS-${{ matrix.arch }}.dmg" --repo "$GITHUB_REPOSITORY" --clobber
