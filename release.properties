# Release config — edit before running releaseBuild from IntelliJ.
#
# This file is the simplest way to pass the version when double-clicking
# `releaseBuild` in IntelliJ's Gradle tasks panel (which doesn't pass any
# command-line args).
#
# Bump `relVer` before each release. Optionally set `cacheVersion` too,
# or leave it commented out to default to "today".
#
# These same values can also be passed on the command line as
# `-PrelVer=X.Y.Z` / `-PcacheVersion=YYYY-MM-DD` — the CLI wins over this
# file when both are set.

# Your GitHub repo for hosting launcher files.
# Format: GitHubUsername/repo-name
# Create this repo at https://github.com/new (name it oasis-launcher-files)
# then replace YOUR_GITHUB_USER below.
githubRepo=xavierrsps/oasis-launcher-files

relVer=1.0.9

# cacheVersion=2026-07-07

# Set to true ONLY when you also want to release a new launcher (MSI).
# Triggers `jpackage`, adds the resulting .msi as a LAUNCHER entry in the
# manifest, and bumps the launcher version players see.
#
# Workflow when bumping the launcher itself:
#   1. Bump `version '1.0.4'` in launcher/build.gradle
#   2. Set includeLauncher=true here
#   3. Run releaseBuild — it'll print instructions to upload BOTH jar + msi
#
# Most releases are client-only and don't need this. Leave it false then.
includeLauncher=false

# Set to true to include cache files (main_file_cache.*, main_file_sprites.*,
# bsp.jar — ~170 MB total) in this release. New players need these for a
# functional install; existing players only redownload when hashes change.
#
# Most client/launcher releases reuse the cache from an earlier tag — set
# cacheTag below to point manifest URLs there instead of rebuilding.
includeCache=false

# When includeCache=false, point manifest cache URLs at this release tag
# instead of rebuilding. Leave empty when includeCache=true.
# Example: cacheTag=v1.0.0
cacheTag=v1.0.8

# Path to your local cache dir. Used when includeCache=true to find the
# files. Defaults to ~/.oasis/cache/.
# cacheSourceDir=C:\\Users\\Burak\\.oasis\\cache
